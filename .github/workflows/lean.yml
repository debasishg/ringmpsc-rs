# Lean 4 proofs of crates/ringmpsc/src/window.rs (RINGLEAN_DESIGN.md, Phase 0).
#
# Runs only when the ringmpsc sources (the proved code and every file whose
# Safety comments can cite the proofs), the crate or workspace manifest, the
# lockfile, or the Lean project change. Do not make this a required check:
# path-filtered workflows don't run on other pushes, so a required check would
# never report.
name: lean

on:
  push:
    paths:
      # check.sh checks [lean: ...] citations in every file under src/.
      - crates/ringmpsc/src/**
      - crates/ringmpsc/Cargo.toml
      # Charon builds the crate and its dependencies with its own nightly.
      - Cargo.toml
      - Cargo.lock
      - crates/ringmpsc/lean/**
      - .github/workflows/lean.yml
  pull_request:
    # Same list as push.
    paths:
      # check.sh checks [lean: ...] citations in every file under src/.
      - crates/ringmpsc/src/**
      - crates/ringmpsc/Cargo.toml
      # Charon builds the crate and its dependencies with its own nightly.
      - Cargo.toml
      - Cargo.lock
      - crates/ringmpsc/lean/**
      - .github/workflows/lean.yml
  workflow_dispatch:

concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with `rev` in crates/ringmpsc/lean/lakefile.toml and with
  # crates/ringmpsc/lean/README.md.
  AENEAS_TAG: nightly-2026.11.24-fb44cb4
  # SHA-256 of that release's aeneas-linux-x86_64.tar.gz (the bundled aeneas,
  # charon and charon-driver binaries). Update it with AENEAS_TAG; GitHub
  # shows it as the asset's `digest`.
  AENEAS_SHA256: 165949cce8f8c2a55acee718579e2a7cfb58e72b48fc08159ad10c5418533542
  # Charon's toolchain: `channel` in the release's rust-toolchain file.
  CHARON_TOOLCHAIN: nightly-2026-09-17
  # elan (Lean's version manager), pinned by release and checksum. Its install
  # script always fetches the latest binary, so the release asset is used.
  ELAN_VERSION: v4.4.0
  ELAN_SHA256: 0e8250aa2be86c7af929ade68db617af9edc8b9ccf6eaf5ece228250d0d032e2
  AENEAS_DIR: ${{ github.workspace }}/.aeneas

jobs:
  proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Cache Aeneas release
        id: aeneas-cache
        uses: actions/cache@v4
        with:
          path: .aeneas
          key: aeneas-linux-x86_64-${{ env.AENEAS_TAG }}-${{ env.AENEAS_SHA256 }}

      - name: Download Aeneas release (bundles aeneas, charon, charon-driver)
        if: steps.aeneas-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$AENEAS_DIR"
          gh release download "$AENEAS_TAG" -R AeneasVerif/aeneas \
            -p 'aeneas-linux-x86_64.tar.gz' -D "$AENEAS_DIR"
          echo "$AENEAS_SHA256  $AENEAS_DIR/aeneas-linux-x86_64.tar.gz" | sha256sum -c -
          tar xzf "$AENEAS_DIR/aeneas-linux-x86_64.tar.gz" -C "$AENEAS_DIR"
          rm "$AENEAS_DIR/aeneas-linux-x86_64.tar.gz"

      - name: Check Charon toolchain pin
        run: grep -q "\"$CHARON_TOOLCHAIN\"" "$AENEAS_DIR/rust-toolchain"

      - name: Install Charon's Rust toolchain
        run: |
          rustup toolchain install "$CHARON_TOOLCHAIN" --profile minimal \
            -c rustc-dev -c llvm-tools -c rust-src -c miri

      - name: Install elan (pinned)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tmp="$(mktemp -d)"
          gh release download "$ELAN_VERSION" -R leanprover/elan \
            -p 'elan-x86_64-unknown-linux-gnu.tar.gz' -D "$tmp"
          echo "$ELAN_SHA256  $tmp/elan-x86_64-unknown-linux-gnu.tar.gz" | sha256sum -c -
          tar xzf "$tmp/elan-x86_64-unknown-linux-gnu.tar.gz" -C "$tmp"
          "$tmp/elan-init" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Lean toolchain and packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan/toolchains
            crates/ringmpsc/lean/.lake
          key: lean-${{ hashFiles('crates/ringmpsc/lean/lean-toolchain', 'crates/ringmpsc/lean/lake-manifest.json') }}

      - name: Fetch Lean dependencies (Aeneas library, Mathlib cache)
        working-directory: crates/ringmpsc/lean
        run: lake exe cache get

      - name: Regenerate, prove, audit axioms, check citations
        run: crates/ringmpsc/lean/scripts/check.sh --check-generated
