[package]
name = "ringmpsc-verified"
version = "0.1.0"
edition = "2021"

[dependencies]
vstd = "=0.0.0-2026-10-18-0147"
verus_state_machines_macros = "=0.0.0-2026-10-18-0147"

# Phase 7 (#26): differential tests and benchmarks against the production
# crate. Dev-only: verification (`cargo verus`) never builds these.
[dev-dependencies]
ringmpsc-rs = { path = "../../crates/ringmpsc" }
quint-connect = "0.1.1"
anyhow = "1"  # used by quint-connect's `switch!` expansion
serde = { version = "1.0", features = ["derive"] }
proptest = "1.4"
criterion = "0.5"

[[bench]]
name = "verified_vs_production"
harness = false

[package.metadata.verus]
verify = true

[lints.rust]
# Verus supports ghost code, code that is used for proofs but erased during compilation.
# This means that ghost items that are imported via `use` will not exist during a normal
# `cargo build`, leading to compilation errors. These errors can be prevented by guarding the
# use statements with the feature flag `verus_only`, which Verus turns on during
# verification.
#
# WARNING: this flag should only be used on import statements and setting config attributes,
# see the documentation (https://verus-lang.github.io/verus/guide/erasure.html) for more details.
#
# This lint suppression prevents cargo from complaining about the
# `verus_only` feature flag being undeclared.
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(verus_only)',
  # Emitted by `tokenized_state_machine!` for ghost-only items.
  'cfg(verus_keep_ghost)',
  'cfg(verus_keep_ghost_body)',
] }
# Standalone workspace: Verus pins its own toolchain, so this crate stays
# out of the root workspace.
[workspace]
