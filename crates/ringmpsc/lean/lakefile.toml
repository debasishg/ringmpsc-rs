# Lean 4 proofs for ringmpsc's pure index/window arithmetic (RINGLEAN_DESIGN.md, Phase 0).
#
#   RingmpscRs/  generated by Charon + Aeneas from crates/ringmpsc/src/window.rs. Do not edit.
#   RingLean/    hand-written theorems about the generated definitions.
#
# Regenerate and check with: crates/ringmpsc/lean/scripts/check.sh
name = "ringlean"
defaultTargets = ["RingmpscRs", "RingLean"]

# Pinned to the Aeneas release whose `aeneas` and `charon` binaries
# generate RingmpscRs/. CI downloads that release by its tag, AENEAS_TAG in
# .github/workflows/lean.yml; keep this `rev` and that tag in step.
# Locally, scripts/check.sh uses the binaries unpacked at $AENEAS_DIR.
[[require]]
name = "aeneas"
git = "https://github.com/AeneasVerif/aeneas"
rev = "fb44cb400eb6bfe7dce97422ebe8fa748b7e4f9b"
subDir = "backends/lean"

[[lean_lib]]
name = "RingmpscRs"
globs = ["RingmpscRs.+"]

[[lean_lib]]
name = "RingLean"
globs = ["RingLean.+"]
